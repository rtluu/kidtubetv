[build]
  publish = "dist"
  command = "expo export -p web"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."pbs-show-videos"]
  timeout = 26

[functions."channels"]
  timeout = 26

[dev]
  command = "npx expo start --web"
  targetPort = 8081
  port = 8888
  autoLaunch = false
